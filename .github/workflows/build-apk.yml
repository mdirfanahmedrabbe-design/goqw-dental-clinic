name: Build APK

# Runs on every push to main (and on manual dispatch). Builds the debug
# APK, uploads it as a build artifact, AND creates a GitHub Release
# attaching the same APK, so the bot can hand the user a download link.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # needed for softprops/action-gh-release to create a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
